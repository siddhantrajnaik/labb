<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6b21a8"><title>Labb</title><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css"></head><body>
<div id="login" class="login-screen"><div class="login-card"><div class="brand"><span class="mark">⚗</span>Labb</div><h1>Laboratory workspace</h1><p>GitHub Pages frontend · Supabase backend</p><div id="configWarning" class="notice" hidden><b>Supabase is not configured.</b><br>Edit <code>config.js</code> with your project URL and publishable key, then deploy again.</div><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="username" required placeholder="name@lab.org"></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form><div id="loginMessage" class="sub"></div></div></div>
<div id="app" hidden><aside><div class="brand"><span class="mark">⚗</span>Labb</div><div class="user"><b id="who"></b><small id="role"></small></div><nav><button data-page="inventory" class="active">▣ Inventory</button><button data-page="procurement">🛒 Procurement</button><button data-page="vendors">▤ Vendors</button><button data-page="analytics">▥ Analytics</button><button data-page="settings">⚙ Settings</button></nav></aside><main><header><input id="search" placeholder="Search inventory..."><span class="pill">Supabase</span><button id="scan">⌁ Scan</button><button id="newRequest" class="primary">+ New Request</button></header><section id="page"></section></main></div>
<div id="modal"></div><div id="toast"></div><script type="module" src="./app.js"></script></body></html>
